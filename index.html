<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Min hjemmeside</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 45px;
            margin: 0 0 10px;
        }

        header p {
            font-size: 20px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <header>
        <h1>Velkommen!</h1>
        <p>Dette er min nye hjemmeside</p>
    </header>

    <main>
        <div class="box">
            <h2>Om hjemmesiden</h2>

            <p>
                Velkommen til min hjemmeside.
                Her kan jeg skrive alt det, jeg gerne vil fortælle.
            </p>

            <button>Klik her</button>
        </div>
    </main>

</body>
</html>
